env:
  name: academy_3_vs_1_with_keeper
  render: false
  tactical_interval: 50

ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.993
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy: MlpPolicy

training:
  total_timesteps: 3_000_000
  save_freq: 100_000
  eval_freq: 50_000
  eval_episodes: 20
  checkpoint_dir: checkpoints/no_curriculum/
  tensorboard_log: runs/no_curriculum/

curriculum:
  enabled: false
  self_play_start_step: 999_999_999  # Effectively disabled
  opponent_snapshot_freq: 999_999_999
  bot_difficulty_schedule: [1]  # Fixed difficulty

reward_weights:
  goal_scored: 1.0
  goal_conceded: -1.0
  possession_bonus: 0.001
  pressing_success: 0.05
  formation_switch_penalty: -0.01
